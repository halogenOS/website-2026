<!--
  halogenOS mark, battery-life variant. The three variants share one triangle geometry so
  they align with each other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="halogenOS battery life">
  <defs>
    <linearGradient id="batt-accent" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="476">
      <stop offset="0" stop-color="#00b9a8"/>
      <stop offset="0.676" stop-color="#00b255"/>
      <stop offset="1" stop-color="#00913d"/>
    </linearGradient>
    <linearGradient id="batt-pale" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="476">
      <stop offset="0" stop-color="#e0f9e6"/>
      <stop offset="1" stop-color="#ebf9f9"/>
    </linearGradient>
  </defs>

  <g stroke-linejoin="round" stroke-width="47.14">
    <path d="M44.84 256 L383.68 75.29 L383.68 436.71 Z"
          fill="url(#batt-accent)" stroke="url(#batt-accent)"/>
    <path d="M467.16 256 L128.32 75.29 L128.32 436.71 Z" opacity="0.925"
          fill="url(#batt-pale)" stroke="url(#batt-pale)"/>
  </g>

  <path fill-rule="evenodd" fill="url(#batt-accent)"
        d="M247.8 196.2
           H263.8 A4 4 0 0 1 267.8 200.2
           V207.8
           H279.4 A6.4 6.4 0 0 1 285.8 214.2
           V309.1 A6.4 6.4 0 0 1 279.4 315.5
           H232.3 A6.4 6.4 0 0 1 225.9 309.1
           V214.2 A6.4 6.4 0 0 1 232.3 207.8
           H243.8
           V200.2 A4 4 0 0 1 247.8 196.2
           Z
           M251.76 257.92
           V249.76 A4.32 4.32 0 0 1 260.4 249.76
           V257.92
           H268.56 A4.32 4.32 0 0 1 268.56 266.56
           H260.4
           V274.72 A4.32 4.32 0 0 1 251.76 274.72
           V266.56
           H243.6 A4.32 4.32 0 0 1 243.6 257.92
           Z"/>
</svg>
